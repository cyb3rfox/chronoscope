[project]
name = "chronoscope"
version = "0.0.1"
description = "TUI for analyzing Plaso forensic timelines"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "typer>=0.12",
    "orjson>=3.10",
    "blake3>=0.4",
    "cbor2>=5.6",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
    "ulid-py>=1.1",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
]
plaso = ["plaso>=20220501"]

[project.scripts]
chronoscope = "chronoscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronoscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
